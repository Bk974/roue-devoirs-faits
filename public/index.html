:root{
  --paper:#f7f2e8;--card:#fffdf8;--ink:#1d2433;--muted:#5b6070;--line:#ddd4c3;
  --devoir:#1f3a5f;--situation:#b03a2e;--eleve:#7a4a2b;--besoin:#a97c0d;--technique:#5e4b8b;--indic:#17736d;--ajust:#4a7a44;--ecoute:#b4506f;--etsi:#33343d;
  --g3:#2e7d4f;--g2:#a86f0f;--g1:#c0571a;--g0:#b03a2e;
  --focus:#e08a1e;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{font-family:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;line-height:1.38}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:900;line-height:1.1}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.ic{display:inline-block;vertical-align:middle;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- bandeau et pied ---------- */
.top{display:flex;align-items:center;gap:.8rem;padding:.55rem 1.2rem;border-bottom:1px solid var(--line);font-size:.8rem;color:var(--muted);background:var(--paper)}
.top b{color:var(--ink);font-weight:700}
.top .sp{flex:1}
.top a{color:var(--muted);text-decoration:underline;background:none;border:0;cursor:pointer;font-size:.8rem}
.top button.lnk{background:#c0282d;color:#fff;border:0;border-radius:999px;padding:.3em .9em;font-size:.9rem;font-weight:700;cursor:pointer;text-decoration:none;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.top button.lnk:hover{background:#a11f24}
.top button.lnk:focus-visible{outline:3px solid #1d2433;outline-offset:2px}
body.host .top button.lnk{font-size:1rem}
#app{flex:1;width:100%;max-width:1400px;margin:0 auto;padding:1.2rem 1.2rem 2rem;outline:none}
.foot{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;padding:.7rem 1.2rem calc(.7rem + env(safe-area-inset-bottom));border-top:1px solid var(--line);font-size:.78rem;color:var(--muted)}
.foot svg{color:var(--ink)}
.foot a{color:var(--muted)}

/* ---------- boutons ---------- */
.btn{appearance:none;border:0;border-radius:999px;padding:.75em 1.5em;font-weight:700;font-size:1rem;background:var(--ink);color:#fff;cursor:pointer;min-height:46px;display:inline-flex;align-items:center;justify-content:center;gap:.5em;text-decoration:none;transition:transform .08s,box-shadow .15s}
.btn:hover{box-shadow:0 3px 10px rgba(29,36,51,.25)}
.btn:active{transform:translateY(1px)}
.btn.big{font-size:1.25em;padding:.8em 1.9em}
.btn.alt{background:#fff;color:var(--ink);border:1.5px solid var(--ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.sm{min-height:36px;padding:.4em 1em;font-size:.88rem}
.btn[disabled]{opacity:1;background:#e6dfd0;color:#4a5060;border-color:#cfc5b0;cursor:not-allowed;box-shadow:none}
.row{display:flex;gap:.7rem;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.center{text-align:center}
.kick{font-size:.72rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--situation)}

/* ---------- accueil ---------- */
.hero{max-width:980px;margin:1.2rem auto 0}
.hero h1{font-size:clamp(1.6rem,3.6vw,2.5rem);margin:.3rem 0 .5rem}
.lede{font-size:1rem;max-width:44rem;color:#2c3446}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:.9rem;margin:1.2rem 0}
.mode{background:var(--card);border:1.5px solid var(--line);border-top:6px solid var(--c);border-radius:16px;padding:1.2rem;display:flex;flex-direction:column;gap:.7rem;text-align:left}
.mode h2{font-size:1.1rem;display:flex;gap:.5rem;align-items:center;color:var(--c)}
.mode p{color:#2c3446;flex:1;font-size:.92rem}
.how{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.9rem 1.1rem;margin-top:.5rem}
.how{font-size:.92rem}.how summary{font-weight:700;cursor:pointer}
.how ol{margin:.6rem 0 0 1.2rem;display:grid;gap:.35rem}

/* ---------- formulaires ---------- */
.panel{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:1.2rem;max-width:720px;margin:1rem auto}
.panel h2{font-size:1.5rem;margin-bottom:.4rem}
.field{display:grid;gap:.3rem;margin:.9rem 0}
.field label,.field .lab{font-weight:700;font-size:.9rem}
.field input[type=text]{border:1.5px solid var(--line);border-radius:10px;padding:.7em .9em;font:inherit;font-size:1.05rem;background:#fff;min-height:46px;width:100%}
.code-in{font-family:Fraunces,serif;font-weight:900;letter-spacing:.25em;text-transform:uppercase;font-size:1.6rem!important;text-align:center}
.choices{display:grid;gap:.5rem}
.choice{display:flex;gap:.7rem;align-items:flex-start;border:1.5px solid var(--line);border-radius:12px;padding:.7rem .9rem;background:#fff;cursor:pointer}
.choice input{margin-top:.3rem;accent-color:var(--ink);width:18px;height:18px}
.choice:has(input:checked){border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.choice b{display:block}
.choice small{color:var(--muted)}
.note{font-size:.88rem;color:var(--muted)}
.warn{background:#fff3e6;border:1px solid #f0c48f;border-radius:10px;padding:.6rem .8rem;font-size:.9rem;color:#6b3d05}
.err{color:var(--situation);font-weight:700;font-size:.9rem}

/* ---------- cartes ---------- */
.card{--c:var(--devoir);background:var(--card);border:1.5px solid var(--c);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;position:relative}
.band{background:var(--c);color:#fff;display:flex;align-items:center;gap:.5em;padding:.5em .85em;font-weight:800;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase}
.band .lab{flex:1}
.band .num{font-family:Fraunces,serif;font-weight:900;font-size:1.35rem;letter-spacing:0}
.cb{padding:.8em 1em 1em;display:flex;flex-direction:column;gap:.55em}
.disc{font-size:.74rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--c)}
.quote{font-family:Fraunces,serif;font-weight:700;font-size:1.28rem;line-height:1.22}
.tags{display:flex;gap:.4rem;flex-wrap:wrap}
.tag{display:inline-block;border:1.5px solid var(--c);color:var(--c);border-radius:999px;padding:.05em .7em;font-size:.76rem;font-weight:700}
.tag.f{background:var(--c);color:#fff}
.c-devoir{--c:var(--devoir)}.c-situation{--c:var(--eleve)}.c-besoin{--c:var(--besoin)}.c-technique{--c:var(--technique)}.c-indic{--c:var(--indic)}.c-ecoute{--c:var(--ecoute)}.c-etsi{--c:var(--etsi)}.c-ajust{--c:var(--ajust)}
.deal{animation:deal .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes deal{from{opacity:0;transform:translateY(14px) rotate(-1.2deg)}to{opacity:1;transform:none}}

/* ---------- dialogue d'écoute ---------- */
.talk{display:grid;gap:.6rem}
.qbtns{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:.5rem}
.qbtn{text-align:left;border:1.5px solid var(--ecoute);background:#fff;color:var(--ink);border-radius:12px;padding:.6em .9em;cursor:pointer;display:flex;gap:.6em;align-items:center;min-height:46px;font-weight:600}
.qbtn .id{font-family:Fraunces,serif;font-weight:900;color:var(--ecoute)}
.qbtn:hover{background:#fbeef2}
.qbtn[disabled]{cursor:default;background:#f3ede0;border-style:dashed;color:#4a5060}
.qbtn[disabled]::after{content:"✓";margin-left:auto;font-weight:900;color:var(--g3);font-size:1.1em}
.exch{display:grid;gap:.15rem;animation:deal .35s both}
.exch .q{font-size:.82rem;font-weight:700;color:var(--ecoute)}
.bubble{background:#fff;border:1px solid var(--line);border-left:5px solid var(--eleve);border-radius:4px 14px 14px 14px;padding:.55em .85em}
.bubble.obs{border-left-color:var(--indic);background:#f0f8f6;font-style:italic}
.bubble .who{display:block;font-size:.7rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--eleve);font-style:normal}
.bubble.obs .who{color:var(--indic)}
.counter{display:inline-flex;align-items:center;gap:.4rem;font-weight:800;font-size:.9rem;padding:.2em .8em;border-radius:999px;background:#fff;border:1.5px solid var(--ecoute);color:var(--ecoute)}
.counter.ok{background:var(--ecoute);color:#fff}

/* ---------- options ---------- */
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:.9rem}
.opt{--gc:var(--ink);position:relative;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:1.5em 1em 1em 1em;display:flex;flex-direction:column;gap:.6em;text-align:left;cursor:default}
button.opt{cursor:pointer;width:100%}
button.opt:hover{border-color:var(--ink)}
.opt.sel{border-color:var(--ink);box-shadow:0 0 0 3px rgba(29,36,51,.18);background:#fff}
.opt .L{position:absolute;top:-.6em;left:.8em;background:var(--ink);color:#fff;font-family:Fraunces,serif;font-weight:900;width:2em;height:2em;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.05rem}
.opt .lbl{font-size:.68rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.opt .lbl.b{color:var(--besoin)}.opt .lbl.t{color:var(--technique)}
.opt .nm{font-family:Fraunces,serif;font-weight:700;font-size:1.22rem;line-height:1.15}
.opt .df{font-size:.86rem;color:var(--muted)}
.opt .say{font-style:italic;font-size:.9rem;background:#f4effc;border-left:4px solid var(--technique);border-radius:0 8px 8px 0;padding:.4em .7em}
.opt.rev{border-color:var(--gc);background:color-mix(in srgb,var(--gc) 7%,#fffdf8)}
.opt.g3{--gc:var(--g3)}.opt.g2{--gc:var(--g2)}.opt.g1{--gc:var(--g1)}.opt.g0{--gc:var(--g0)}
.grade{align-self:flex-start;display:inline-flex;align-items:center;gap:.4em;border-radius:999px;padding:.15em .8em;font-weight:800;font-size:1rem;color:#fff;background:var(--gc)}
body.host .grade{font-size:1.15rem;padding:.25em 1em}
.why{font-size:.93rem;line-height:1.35}
.mine{position:absolute;top:-.6em;right:.8em;background:#fff;border:2px solid var(--ink);border-radius:999px;font-weight:800;font-size:.72rem;padding:.1em .7em}
.votes{display:flex;align-items:center;gap:.5rem;margin-top:auto;padding-top:.3rem}
.votes button{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--ink);background:#fff;font-size:1.3rem;font-weight:700;cursor:pointer;line-height:1}
.votes .n{font-family:Fraunces,serif;font-weight:900;font-size:1.5rem;min-width:1.6em;text-align:center}
.bar{height:12px;border-radius:6px;background:#e9e2d2;overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:var(--ink);transition:width .5s}

/* ---------- animateur (projection) ---------- */
body.host{font-size:clamp(16px,1.05vw,22px)}
.hbar{display:flex;align-items:center;gap:1rem;flex-wrap:wrap;margin-bottom:.9rem}
.hbar .tour{font-family:Fraunces,serif;font-weight:900;font-size:1.6rem}
.chip{display:inline-flex;align-items:center;gap:.4em;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:.15em .8em;font-weight:700;font-size:.85rem}
.chip.code{font-family:Fraunces,serif;font-weight:900;letter-spacing:.18em;font-size:1rem;border-color:var(--ink)}
.steps{display:flex;gap:.4rem;flex-wrap:wrap;margin-left:auto}
.step{border-radius:999px;padding:.25em .9em;background:#fff;border:1.5px solid var(--line);font-weight:700;font-size:.82rem;color:var(--muted)}
.step.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.step.done{color:var(--ink);border-color:var(--ink)}
.stage{display:grid;gap:1.4rem}
.two{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:1.4rem;align-items:start}
.split{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:1.4rem;align-items:start}
.aside{display:grid;gap:.9rem}
.box{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:.8em 1em}
.box h3{font-size:1rem;margin-bottom:.3rem;font-family:"Source Sans 3";font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:.74rem}
.pro{font-family:"Source Sans 3",system-ui,sans-serif;font-weight:400;font-size:1.02rem;line-height:1.5}
.pro b{color:var(--eleve);font-weight:800}
.pro em{font-style:normal;background:#fff0c9;border-radius:4px;padding:0 .15em}
.revcode .code-big{font-size:1.7rem}
.code-big{font-family:Fraunces,serif;font-weight:900;font-size:3rem;letter-spacing:.2em;text-align:center;background:var(--ink);color:#fff;border-radius:14px;padding:.2em .4em}
.chrono{font-family:Fraunces,serif;font-weight:900;font-size:2.2rem}
.chrono.end{color:var(--situation);animation:blink .8s infinite}
@keyframes blink{50%{opacity:.3}}
.remonter{border-left:6px solid var(--devoir);background:#eef2f8}

/* ---------- roue ---------- */
.wheel-stage{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:2rem;align-items:center}
.wheel-wrap{position:relative;width:min(100%,68vh);aspect-ratio:1;margin:0 auto}
.wheel{width:100%;height:100%;display:block;transform:rotate(0deg);transition:transform var(--spin,5.2s) cubic-bezier(.12,.62,.08,1);filter:drop-shadow(0 6px 14px rgba(29,36,51,.28))}
.hub{position:absolute;inset:50%;width:19%;height:19%;transform:translate(-50%,-50%);border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Fraunces,serif;font-weight:900;font-size:clamp(.7rem,1.5vw,1.2rem);line-height:1;border:4px solid var(--card);box-shadow:0 2px 8px rgba(0,0,0,.3)}
.pointer{position:absolute;top:-2.2%;left:50%;width:8%;transform:translateX(-50%);z-index:2;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.pointer.bump{animation:bump .5s}
@keyframes bump{30%{transform:translateX(-50%) translateY(6px) scale(1.12)}}
.drawn{display:grid;gap:.4rem}

/* ---------- équipes et solo (téléphone) ---------- */
.play{max-width:640px;margin:0 auto;display:grid;gap:1rem}
.phead{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.dots{display:flex;gap:.3rem;flex-wrap:wrap}
.dots i{width:12px;height:12px;border-radius:50%;background:#e2dac8;display:block}
.dots i.done{background:var(--ink)}.dots i.cur{outline:2px solid var(--ink);outline-offset:2px}
.sect{display:grid;gap:.6rem}
.sect>h2{font-size:1.25rem}
.sticky{position:sticky;bottom:0;background:linear-gradient(transparent,var(--paper) 30%);padding:.8rem 0 calc(.6rem + env(safe-area-inset-bottom));display:flex;gap:.6rem;flex-wrap:wrap;z-index:5}
.sticky .btn{flex:1}
.locked{text-align:center;display:grid;gap:.7rem}
.locked .ok{font-family:Fraunces,serif;font-weight:900;font-size:1.6rem}
.codeform{display:flex;gap:.5rem;justify-content:center}
.codeform input{width:6em;text-align:center;font-family:Fraunces,serif;font-weight:900;font-size:1.6rem;letter-spacing:.2em;text-transform:uppercase;border:2px solid var(--ink);border-radius:12px;padding:.3em;min-height:52px}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:.6em .8em;font:inherit;min-height:4.5em;background:#fff}

/* ---------- bilan ---------- */
.bilan{max-width:860px;margin:0 auto;display:grid;gap:1rem}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:.7rem}
.kpi{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:.8em 1em}
.kpi .v{font-family:Fraunces,serif;font-weight:900;font-size:2rem;line-height:1}
.kpi .l{font-size:.8rem;color:var(--muted);font-weight:700}
.rows{display:grid;gap:.5rem}
.rw{display:grid;grid-template-columns:2.4rem 1fr auto;gap:.7rem;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.55em .8em}
.rw .n{font-family:Fraunces,serif;font-weight:900;font-size:1.2rem}
.rw small{color:var(--muted)}
.pill{display:inline-flex;align-items:center;border-radius:999px;padding:.1em .7em;font-weight:800;font-size:.78rem;color:#fff;background:var(--gc,var(--ink))}
.pill.g3{--gc:var(--g3)}.pill.g2{--gc:var(--g2)}.pill.g1{--gc:var(--g1)}.pill.g0{--gc:var(--g0)}

/* ---------- fenêtre QR ---------- */
.modal{position:fixed;inset:0;background:rgba(29,36,51,.72);display:flex;align-items:center;justify-content:center;z-index:50;padding:1rem}
.modal .in{background:var(--card);border-radius:20px;padding:1.4rem;max-width:min(92vw,560px);width:100%;display:grid;gap:.8rem;text-align:center;max-height:94vh;overflow:auto}
.qr{width:min(64vw,320px,50vh);margin:0 auto;background:#fff;padding:10px;border-radius:12px;border:1px solid var(--line)}
.qr svg{width:100%;height:auto;display:block}

@media (max-width:900px){
  .two,.split,.wheel-stage{grid-template-columns:1fr}
  .wheel-wrap{width:min(100%,86vw)}
  .steps{margin-left:0}
}
@media (max-width:520px){
  #app{padding:.9rem .9rem 1.5rem}
  .top{font-size:.72rem;padding:.5rem .8rem}
  .opts{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  .wheel{transition-duration:.6s!important}
  .deal,.exch,.pointer.bump,.chrono.end{animation:none!important}
}
@media print{.top,.foot,.btn,.sticky{display:none}}

.lobby{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2rem;align-items:center;max-width:1000px;margin:1rem auto}
.lobby .left{display:grid;gap:.8rem;justify-items:center}
.lobby .qr{width:min(34vw,300px,46vh)}
.lobby .code-big{width:100%;font-size:2.4rem}
.lobby .right{display:grid;gap:.8rem}
.lobby .right h2{font-size:1.9rem}
@media (max-width:820px){.lobby{grid-template-columns:1fr}}

.dots{display:inline-flex;gap:.2em;vertical-align:middle;margin-right:.5em}.dots i{display:inline-block;width:.8em;height:.8em;border-radius:50%}
.tag .dots{margin-right:.4em}.tag .dots i{width:.65em;height:.65em}
.chip .dots i{width:.7em;height:.7em}

/* débat : la question est le point focal */
.debate-hero{background:var(--card);border:2px solid var(--ink);border-radius:16px;padding:.8rem 1.2rem;margin-bottom:.9rem}
.debate-hero p{font-family:Fraunces,serif;font-weight:800;font-size:clamp(1.4rem,2.6vw,2.2rem);line-height:1.2;margin-top:.15rem}
.votes .n{font-size:1.25rem}
body.host .step{font-size:.95rem}
/* téléphone : cartes de choix plus courtes, la phrase apparaît sur la carte choisie */
@media (max-width:640px){
  button.opt:not(.sel) .say{display:none}
  .opt{padding-bottom:.8em}
}
.stage.st-debat .opt .say{display:none}
.debate-hero{padding:.6rem 1.1rem}
.debate-hero p{font-size:clamp(1.3rem,2.3vw,2rem)}

.tag.f .dots i{box-shadow:0 0 0 1.5px #fff}
.opencode .code-big{font-size:2.2rem}

/* relais en direct */
.ready{font-size:1.25rem;font-weight:700;margin:.1rem 0 .3rem}
.ready b,.joined b{font-family:Fraunces,serif;font-weight:900;font-size:1.5em}
.joined{margin:.6rem 0;font-size:1.05rem}
.names{font-size:.9rem;color:var(--muted);margin-top:.35rem}
.locked .sent{font-weight:700;color:var(--g3)}
.locked .sent.no{color:var(--g1)}

.mode .btn.pastel{color:#1d2433;border:2px solid transparent;box-shadow:none}
.mode .btn.pastel.sky{background:#bfe3f7;border-color:#8cc6e6}
.mode .btn.pastel.peach{background:#fbd7ae;border-color:#f0b46f}
.mode .btn.pastel.mint{background:#cdebd0;border-color:#9bd0a1}
.mode .btn.pastel:hover,.mode .btn.pastel:focus-visible{filter:brightness(.96);transform:translateY(-1px)}

</style>

}

/* ---------- QR code ---------- */
function qrSVG(text) {
  try {
    const q = qrcode(0, "M"); q.addData(text); q.make();
    const n = q.getModuleCount(); let d = "";
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) d += `M${c} ${r}h1v1h-1z`;
    return `<svg viewBox="-2 -2 ${n + 4} ${n + 4}" shape-rendering="crispEdges" role="img" aria-label="QR code pour rejoindre la partie"><path d="${d}" fill="#1d2433"/></svg>`;
  } catch (e) { return '<p class="err">QR code indisponible : donnez le code oralement.</p>'; }
}
function qrParts() {
  const url = joinURL(), isFile = location.protocol === "file:" && !store.get("dfr:base");
  return {
    qr: `<div class="qr">${qrSVG(url)}</div>`,
    code: `<div class="code-big" aria-label="Code de la partie">${G.code}</div>`,
    note: `<p class="note">Les équipes ouvrent la page, choisissent « Rejoindre » et saisissent le code, ou scannent le QR code.</p>`,
    form: `<form data-form="base" class="field" style="text-align:left"><label for="baseurl">Adresse de la page (à corriger si besoin)</label><input type="text" id="baseurl" name="base" value="${esc(baseURL())}" inputmode="url" autocomplete="off"><button class="btn sm alt" type="submit" style="justify-self:start">Mettre à jour le QR code</button></form>`,
    warn: isFile ? `<div class="warn">La page est ouverte depuis un fichier de l’ordinateur : les téléphones ne pourront pas l’atteindre avec ce QR code. Publiez la page (par exemple sur Netlify), ouvrez-la depuis son adresse, ou collez cette adresse ci-dessus. Vous pouvez aussi donner le code oralement, si la page est déjà ouverte sur les téléphones.</div>` : ""
  };
}
function qrBlock() { const p = qrParts(); return p.qr + p.code + p.note + p.form + p.warn; }

/* ----- bilan ----- */
function rowsOf() {
  return G.seq.map((id, t) => ({ t, cs: CASEBY[id], r: G.res[t] })).filter(x => x.r && x.r.g !== null && x.r.g !== undefined && x.r.stage === "reveal");
}
function analyse(rows) {
  const N = rows.length; if (!N) return null;
  const pts = rows.reduce((s, x) => s + x.r.g, 0), good = rows.filter(x => x.r.g >= 2).length;
  const avgQ = rows.reduce((s, x) => s + x.r.nq, 0) / N, fast = rows.filter(x => x.r.nq < 2).length;
  const cnt = {}; rows.filter(x => x.r.g <= 1).forEach(x => cnt[x.r.b] = (cnt[x.r.b] || 0) + 1);
  const top = Object.entries(cnt).sort((a, b) => b[1] - a[1])[0];
  return { N, adj: Math.round(pts / (3 * N) * 100), good, avgQ, fast, trap: top ? TRAP[top[0]] : null };
}
function hostRows() {
  return G.seq.map((id, t) => ({ t, cs: CASEBY[id], r: G.res[t] })).filter(x => x.r && x.r.stage === "reveal");
}
function vBilan() {
  if (G.mode === "host") {
    const rows = hostRows(); let tv = 0, sumG = 0, good = 0;
    const lines = rows.map(x => {
      const opts = optionsFor(G.seed, x.cs), v = x.r.votes, tot = Object.values(v).reduce((a, b) => a + b, 0);
      opts.forEach(o => { tv += v[o.L]; sumG += v[o.L] * o.g; if (o.g >= 2) good += v[o.L]; });
      return { x, opts, v, tot };
    });
    return `<div class="bilan"><div><div class="kick">Bilan de la séance · ${G.code}</div><h2 style="font-size:2rem">${rows.length} tour${rows.length > 1 ? "s" : ""} joué${rows.length > 1 ? "s" : ""}</h2></div>
      ${tv ? `<div class="kpis"><div class="kpi"><div class="v">${Math.round(sumG / (3 * tv) * 100)} %</div><div class="l">d’ajustement moyen des choix</div></div><div class="kpi"><div class="v">${Math.round(100 * good / tv)} %</div><div class="l">de choix bien ajustés ou défendables</div></div><div class="kpi"><div class="v">${tv}</div><div class="l">voix comptées</div></div></div>` : `<p class="note">Aucune répartition des équipes n’a été saisie : le bilan ne présente que les tours joués.</p>`}
      <div class="rows">${lines.map(({ x, opts, v, tot }) => `<div class="rw" style="grid-template-columns:2.4rem 1fr"><span class="n">${x.t + 1}</span><div><b>${DEVBY[x.cs.p].disc}</b> <small>· « ${SITUATIONS[x.cs.s].parole} »</small><br><small>${tot ? "Répartition : " + opts.map(o => `${o.L} ${v[o.L]}`).join(" · ") : "Pas de répartition saisie"} · Meilleure proposition : ${opts.filter(o => o.g === 3).map(o => o.L).join(" et ")}</small></div></div>`).join("")}</div>
      <div class="box"><h3>Ce que le jeu a montré</h3><p>Une même technique n’est pas la bonne réponse à un même devoir : ce sont la situation de l’élève et ce qu’on en a écouté qui orientent l’hypothèse. Pour la suite : quelle aide pourriez-vous retirer à la prochaine séance ?</p></div>
      <div class="row"><button class="btn" data-act="copy">Copier le bilan</button><button class="btn alt" data-act="download">Télécharger (.txt)</button>${G.done ? "" : `<button class="btn ghost" data-act="back">Reprendre la partie</button>`}<button class="btn ghost" data-act="go" data-v="home">Accueil</button></div></div>`;
  }
  const rows = rowsOf(), a = analyse(rows);
  if (!a) return `<div class="bilan"><h2>Pas encore de bilan</h2><p>Aucun tour n’a été terminé.</p><div class="row"><button class="btn" data-act="back">Reprendre</button></div></div>`;
  const bullets = [];
  if (G.mode === "team") { /* l’écoute se fait en salle : pas de mesure sur le téléphone */ } else if (a.fast) bullets.push(`Dans ${a.fast} tour${a.fast > 1 ? "s" : ""} sur ${a.N}, vous avez choisi avec moins de deux questions d’écoute. Écouter d’abord change souvent l’hypothèse.`);
  else bullets.push("Vous avez toujours posé au moins deux questions avant de choisir : c’est la règle d’or du jeu.");
  if (a.trap) bullets.push(a.trap);
  bullets.push("Une même technique n’est jamais la bonne réponse à un même devoir : la situation de l’élève, écoutée, oriente l’hypothèse.");
  return `<div class="bilan"><div><div class="kick">Bilan${G.mode === "team" ? " · " + esc(G.team) : ""} · ${G.code}</div><h2 style="font-size:2rem">${a.N} tour${a.N > 1 ? "s" : ""} joué${a.N > 1 ? "s" : ""}</h2></div>
    <div class="kpis"><div class="kpi"><div class="v">${a.adj} %</div><div class="l">d’ajustement moyen</div></div><div class="kpi"><div class="v">${a.good}/${a.N}</div><div class="l">choix bien ajustés ou défendables</div></div>${G.mode === "team" ? "" : `<div class="kpi"><div class="v">${a.avgQ.toFixed(1).replace(".", ",")}</div><div class="l">questions d’écoute par tour</div></div>`}</div>
    <div class="rows">${rows.map(x => `<div class="rw"><span class="n">${x.t + 1}</span><div><b>${DEVBY[x.cs.p].disc}</b><br><small>« ${SITUATIONS[x.cs.s].parole} »${G.mode === "team" ? "" : ` · ${x.r.nq} question${x.r.nq > 1 ? "s" : ""}`}${x.r.note ? " · " + esc(x.r.note) : ""}</small></div><span class="pill g${x.r.g}">${GRADE[x.r.g].l}</span></div>`).join("")}</div>
    <div class="box"><h3>Ce que vous retenez</h3><ul style="margin:.3rem 0 0 1.1rem;display:grid;gap:.3rem">${bullets.map(b => `<li>${b}</li>`).join("")}</ul></div>
    <div class="row"><button class="btn" data-act="copy">Copier le bilan</button><button class="btn alt" data-act="download">Télécharger (.txt)</button>${G.done ? (G.mode === "solo" ? `<button class="btn ghost" data-act="go" data-v="solosetup">Nouvelle série</button>` : "") : `<button class="btn ghost" data-act="back">Reprendre</button>`}<button class="btn ghost" data-act="go" data-v="home">Accueil</button></div></div>`;
}
function exportText() {
  const date = new Date().toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" });
  const L = ["Écouter avant d’aider · La roue des devoirs prescrits", `Série ${G.code}${G.team ? " · " + G.team : ""} · ${date}`, ""];
  if (G.mode === "host") {
    hostRows().forEach(x => {
      const o = optionsFor(G.seed, x.cs), v = x.r.votes, tot = Object.values(v).reduce((a, b) => a + b, 0);
      L.push(`Tour ${x.t + 1} · ${DEVBY[x.cs.p].disc} · « ${SITUATIONS[x.cs.s].parole} »`);
      L.push("  " + (tot ? "Répartition : " + o.map(q => `${q.L} ${v[q.L]}`).join(", ") : "Pas de répartition saisie") + " · Meilleure proposition : " + o.filter(q => q.g === 3).map(q => q.L).join(" et "));
    });
  } else {
    const rows = rowsOf(), a = analyse(rows);
    rows.forEach(x => {
      L.push(`Tour ${x.t + 1} · ${DEVBY[x.cs.p].disc} · « ${SITUATIONS[x.cs.s].parole} »`);
      L.push(`  Choix ${x.r.pick} : ${BES[x.r.b].n} + ${tecOf(x.r.t, x.cs.p).n} → ${GRADE[x.r.g].l} ${G.mode === "team" ? "" : "· " + x.r.nq + " question(s) d’écoute"}${x.r.note ? " · Note : " + x.r.note : ""}`);
    });
    if (a) L.push("", `Ajustement moyen : ${a.adj} % · ${a.good}/${a.N} choix bien ajustés ou défendables · ${a.avgQ.toFixed(1)} question(s) d’écoute par tour`);
  }
  L.push("", "Licence CC BY-NC · M. Clément · Mission académique Devoirs faits · Académie de La Réunion");
  return L.join("\n");
}

/* ---------- rendu ---------- */
function view() {
  switch (VIEW) {
    case "home": return vHome();
    case "hostsetup": return vHostSetup();
    case "solosetup": return vSoloSetup();
    case "join": return vJoin();
    case "host": return vHost();
    case "play": return vPlay();
    case "bilan": return vBilan();
  }
  return vHome();
}
function render(top) {
  document.body.classList.toggle("host", VIEW === "host" || (VIEW === "bilan" && G && G.mode === "host"));
  APP().innerHTML = fr(view() + (UI.qr ? qrModal() : ""));
  if (top) window.scrollTo(0, 0);
  if (VIEW === "host" && !G.lobby && R().stage === "choix" && G.chronoEnd) resumeChrono();
  managePoll();
}
const qrModal = () => `<div class="modal" role="dialog" aria-modal="true" aria-label="Rejoindre la partie"><div class="in">${qrBlock()}<button class="btn" data-act="closeQr">Fermer</button></div></div>`;
function go(v, params) { VIEW = v; UI.joinErr = ""; UI.warn = false; UI.qr = false; render(true); }
function setHash(h) { if (location.hash === h) return; UI.skip = true; location.hash = h; }

/* ---------- chronomètre ---------- */
let chronoT = null;
function tickChrono() {
  const el = $("#chrono"); if (!el) { clearInterval(chronoT); return; }
  const left = Math.max(0, G.chronoEnd - Date.now()), s = Math.ceil(left / 1000);
  el.textContent = Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
  el.classList.toggle("end", left === 0 && G.chronoEnd > 0);
  if (left === 0) clearInterval(chronoT);
}
function resumeChrono() { clearInterval(chronoT); tickChrono(); if (G.chronoEnd > Date.now()) chronoT = setInterval(tickChrono, 250); }

/* ---------- actions ---------- */
function gradeOf(pickL) { return curOpts().find(o => o.L === pickL); }
function updateVotes() {
  const v = R().votes, tot = Object.values(v).reduce((a, b) => a + b, 0);
  ["A", "B", "C", "D"].forEach(L => { const n = $("#vn-" + L), b = $("#vb-" + L); if (n) n.textContent = v[L]; if (b) b.style.width = (tot ? Math.round(100 * v[L] / tot) : 0) + "%"; });
}
const ACT = {
  go: (d) => { if (d.v === "hostsetup") setHash("#/animer"); else if (d.v === "solosetup") setHash("#/seul"); else if (d.v === "join") setHash("#/jouer"); else setHash("#/"); go(d.v); },
  resume: (d) => {
    const s = store.get("dfr:g:" + d.m); if (!s) return;
    G = s; if (d.m === "host") { VIEW = "host"; setHash("#/animer"); } else { VIEW = "play"; }
    G.res && Object.keys(G.res).length; render(true);
  },
  spin: () => {
    const btn = $('[data-act="spin"]'); if (btn) btn.disabled = true;
    const cs = curCase(), items = wheelItems(G.level), i0 = items.findIndex(i => i.id === cs.p);
    spinTo(i0, items.length, rot => { const r = R(); r.spun = true; r.rot = rot; save(); render(); });
  },
  toEcoute: () => { R().stage = "ecoute"; UI.warn = false; save(); render(true); },
  ask: (d, el) => {
    const r = R(), cs = curCase(); if (r.clues.includes(d.e)) return;
    r.clues.push(d.e); save();
    $("#exch").insertAdjacentHTML("beforeend", fr(exchHTML(cs, [d.e])));
    el.disabled = true;
    const c = $("#counter"); if (c) c.outerHTML = fr(counterHTML(r.clues.length));
  },
  toChoix: () => {
    const r = R(); if (r.clues.length < 2 && !UI.warn) { UI.warn = true; render(); return; }
    UI.warn = false; r.stage = "choix"; r.nq = r.clues.length; save(); render(true);
  },
  toDebat: () => { R().stage = "debat"; save(); render(true); },
  reveal: async () => { if (LIVE.ok) await pollRoom(); R().stage = "reveal"; save(); render(true); },
  chrono: (d) => { const now = Date.now(); G.chronoEnd = Math.max(now, G.chronoEnd || 0) + Number(d.m) * 60000; save(); resumeChrono(); },
  vote: (d) => { const r = R(); ensureManual(r); r.manual[d.l] += Number(d.d); syncVotes(r); save(); updateVotes(); },
  pick: (d) => {
    const r = R(); r.pick = d.l; save();
    $$(".opt[data-act=pick]").forEach(b => { const on = b.dataset.l === d.l; b.classList.toggle("sel", on); b.setAttribute("aria-pressed", on ? "true" : "false"); });
    const lb = $("#lockbtn"); if (lb) { lb.disabled = false; lb.textContent = "Valider mon choix"; }
  },
  lock: () => {
    const r = R(); if (!r.pick) return;
    const o = gradeOf(r.pick); r.g = o.g; r.b = o.b; r.t = o.t; r.nq = r.clues.length;
    r.stage = G.mode === "team" ? "locked" : "reveal"; UI.unlockErr = false; save(); render(true);
    if (G.mode === "team") sendVote(G.tour, r.pick);
  },
  force: () => { R().stage = "reveal"; save(); render(true); },
  forceOpen: () => { const r = R(); if (r.stage === "attente") r.stage = "choix"; UI.unlockErr = false; save(); render(true); },
  next: () => {
    if (G.mode === "host") { G.tour++; G.chronoEnd = 0; UI.warn = false; save(); render(true); return; }
    G.tour++; UI.warn = false; save(); render(true);
  },
  finish: () => { G.done = true; save(); VIEW = "bilan"; render(true); },
  bilan: () => { VIEW = "bilan"; render(true); },
  back: () => { VIEW = G.mode === "host" ? "host" : "play"; render(true); },
  hostStart: () => { G.lobby = false; save(); render(true); },
  qr: () => { UI.qr = true; render(); },
  closeQr: () => { UI.qr = false; render(); },
  copy: async (d, el) => {
    const txt = exportText(); let ok = false;
    try { await navigator.clipboard.writeText(txt); ok = true; } catch (e) {
      const ta = document.createElement("textarea"); ta.value = txt; document.body.appendChild(ta); ta.select();
      try { ok = document.execCommand("copy"); } catch (e2) { } ta.remove();
    }
    el.textContent = ok ? "Bilan copié" : "Copie impossible : utilisez le téléchargement";
  },
  download: () => {
    try {
      const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([exportText()], { type: "text/plain;charset=utf-8" }));
      a.download = "bilan-roue-devoirs-faits-" + G.code + ".txt"; document.body.appendChild(a); a.click(); a.remove();
    } catch (e) { }
  }
};
const FORM = {
  hostCreate: async f => { newGame("host", { seed: randomSeed(), level: f.get("level") || "T" }); if (!LIVE.tried) await probeRelay(); VIEW = "host"; setHash("#/animer"); render(true); },
  soloCreate: f => {
    const raw = (f.get("code") || "").trim(); let seed, level = f.get("level") || "A";
    if (raw) { const p = parseCode(raw); if (!p) { UI.joinErr = "Code invalide : il comporte quatre caractères, un tiret et une lettre (par exemple K7QM-A)."; render(); return; } seed = p.seed; level = p.level; }
    else seed = randomSeed();
    newGame("solo", { seed, level, n: Number(f.get("n")) || 0 }); VIEW = "play"; render(true);
  },
  join: f => {
    const p = parseCode(f.get("code")), team = (f.get("team") || "").trim() || "Équipe";
    if (!p) { UI.joinErr = "Code invalide : il comporte quatre caractères, un tiret et une lettre (par exemple K7QM-A)."; UI.joinCode = f.get("code") || ""; render(); return; }
    store.set("dfr:team", team);
    const saved = store.get("dfr:g:team");
    if (saved && saved.code === p.code && saved.team === team) G = saved; else newGame("team", { seed: p.seed, level: p.level, team });
    VIEW = "play"; UI.joinErr = ""; setHash("#/jouer/" + G.code); render(true); sendJoin();
  },
  unlock: f => {
    const r = R(), v = (f.get("code") || "").toUpperCase().trim();
    if (v === revealCode(G.seed, G.tour + 1)) { r.stage = "reveal"; UI.unlockErr = false; save(); render(true); }
    else {
      const other = G.seq.findIndex((_, k) => k !== G.tour && v === revealCode(G.seed, k + 1));
      UI.openMsg = other >= 0 ? "Ce code est celui d’un autre tour. Vérifier que le téléphone est au même tour que la salle." : "";
      r.wrong++; UI.unlockErr = true; save(); render();
    }
  },
  open: f => {
    const v = (f.get("code") || "").toUpperCase().trim();
    const k = G.seq.findIndex((_, i) => v === openCode(G.seed, i + 1));
    if (k >= 0) {
      G.tour = k; const r = R(); if (r.stage === "attente") r.stage = "choix";
      UI.unlockErr = false; UI.openMsg = ""; save(); render(true);
    } else { const r = R(); r.wrong++; UI.unlockErr = true; UI.openMsg = ""; save(); render(); }
  },
  base: f => { let u = (f.get("base") || "").trim(); if (u) store.set("dfr:base", u.split("#")[0]); render(); }
};

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el || el.disabled) return;
  if (el.getAttribute("type") === "submit") return;
  const f = ACT[el.dataset.act]; if (f) f(el.dataset, el, e);
});
document.addEventListener("submit", e => { const a = e.target.dataset && e.target.dataset.form; if (a && FORM[a]) { e.preventDefault(); FORM[a](new FormData(e.target)); } });
document.addEventListener("input", e => { if (e.target.dataset && e.target.dataset.note && G) { R().note = e.target.value; save(); } });
document.addEventListener("keydown", e => {
  if (VIEW !== "host" || /INPUT|TEXTAREA|SELECT/.test(e.target.tagName) || e.key !== "ArrowRight") return;
  const b = $("[data-primary]"); if (b && !b.disabled) { e.preventDefault(); b.click(); }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && UI.qr) { UI.qr = false; render(); } });

/* ---------- routage par le hash ---------- */
function route() {
  const h = location.hash || "#/", m = h.match(/^#\/jouer\/?([A-Za-z0-9\-]*)/);
  if (m) {
    UI.joinCode = m[1] || "";
    if (G && G.mode === "team" && VIEW === "play" && (!m[1] || parseCode(m[1]) && parseCode(m[1]).code === G.code)) return;
    VIEW = "join";
  } else if (h === "#/animer") { if (!(G && G.mode === "host" && VIEW === "host")) VIEW = "hostsetup"; }
  else if (h === "#/seul") { if (!(G && G.mode === "solo" && VIEW === "play")) VIEW = "solosetup"; }
  else if (!(G && (VIEW === "play" || VIEW === "host" || VIEW === "bilan"))) VIEW = "home";
  render(true);
}
window.addEventListener("hashchange", () => { if (UI.skip) { UI.skip = false; return; } route(); });

/* ---------- pied de page : mois et année en cours ---------- */
function stamp() {
  const el = $("#stamp"); if (!el) return;
  try { el.textContent = new Date().toLocaleDateString("fr-FR", { month: "long", year: "numeric" }); } catch (e) { }
}
stamp(); route(); probeRelay().then(() => { if (VIEW === "host") render(); if (G && G.mode === "team" && VIEW === "play") sendJoin(); });

})();
</script>
</body>
